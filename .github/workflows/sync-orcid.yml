name: Sync ORCID Publications

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-publications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch publications from ORCID
        run: python scripts/fetch_orcid.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add _publications scripts/fetch_orcid.py

          if git diff --cached --quiet; then
            echo "No publication changes."
            exit 0
          fi

          git commit -m "Sync ORCID publications"
          git push